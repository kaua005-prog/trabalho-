<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Formulário Blox Fruits</title>

<style>

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
    color:white;
    overflow-x:hidden;
}

/* MENU SUPERIOR */

.topo{
    width:100%;
    height:80px;

    background:#111827;

    position:fixed;
    top:0;
    left:0;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 25px;

    z-index:1000;

    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.logo{
    color:gold;
    font-size:28px;
    font-weight:bold;
    text-shadow:0 0 10px gold;
}

/* BOTÃO MENU */

.menu-btn{
    font-size:35px;
    cursor:pointer;
    transition:0.3s;
}

.menu-btn:hover{
    color:gold;
    transform:scale(1.1);
}

/* MENU LATERAL */

.sidebar{
    position:fixed;

    top:0;
    left:-300px;

    width:300px;
    height:100vh;

    background:#111827;

    padding:25px;

    transition:0.5s;

    z-index:2000;

    overflow-y:auto;

    box-shadow:0 0 25px rgba(0,0,0,0.6);
}

.sidebar.ativo{
    left:0;
}

/* FECHAR */

.fechar{
    font-size:32px;
    cursor:pointer;
    display:block;
    margin-bottom:25px;
}

/* LINKS */

.sidebar a{
    display:block;

    text-decoration:none;
    color:white;

    background:#1e293b;

    margin-bottom:12px;
    padding:15px;

    border-radius:10px;

    transition:0.3s;

    font-size:18px;
}

.sidebar a:hover{
    background:gold;
    color:black;
    transform:translateX(8px);
}

/* CONTEÚDO */

.conteudo{
    padding:120px 20px 40px;
    max-width:900px;
    margin:auto;
}

/* TOPO FORM */

.banner{
    background:linear-gradient(45deg,#2563eb,#0ea5e9);

    border-radius:20px;

    padding:40px;

    text-align:center;

    margin-bottom:30px;

    animation:fade 1.5s ease;

    box-shadow:0 0 25px rgba(0,0,0,0.4);
}

.banner h1{
    font-size:45px;
    color:white;
    text-shadow:0 0 10px black;
}

/* CARDS */

.card{
    background:#161b22;

    border-radius:18px;

    padding:25px;

    margin-bottom:25px;

    border:2px solid transparent;

    animation:subir 1s ease;

    transition:0.4s;

    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.card:hover{
    transform:translateY(-5px);
    border-color:gold;
    box-shadow:0 0 20px rgba(255,215,0,0.4);
}

/* TITULOS */

.titulo{
    font-size:35px;
    margin-bottom:10px;
    color:gold;
}

.descricao{
    color:#cbd5e1;
    line-height:1.7;
}

/* LABELS */

label{
    display:block;
    font-size:20px;
    margin-bottom:10px;
    color:white;
}

.obrigatorio{
    color:red;
}

/* INPUTS */

input,
textarea,
select{
    width:100%;

    padding:15px;

    margin-top:12px;

    border:none;

    border-radius:10px;

    background:#0f172a;

    color:white;

    font-size:16px;

    outline:none;

    border:2px solid transparent;

    transition:0.3s;
}

input:focus,
textarea:focus,
select:focus{
    border-color:gold;
    box-shadow:0 0 10px gold;
}

textarea{
    resize:none;
    height:130px;
}

/* BOTÃO */

.botao{
    width:100%;

    padding:18px;

    border:none;

    border-radius:15px;

    background:linear-gradient(45deg,gold,orange);

    color:black;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    transition:0.4s;

    animation:pulsar 2s infinite;
}

.botao:hover{
    transform:scale(1.03);
    box-shadow:0 0 25px gold;
}

/* ANIMAÇÕES */

@keyframes fade{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

@keyframes subir{

    from{
        opacity:0;
        transform:translateY(50px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes pulsar{

    0%{
        box-shadow:0 0 10px gold;
    }

    50%{
        box-shadow:0 0 25px orange;
    }

    100%{
        box-shadow:0 0 10px gold;
    }

}

/* RESPONSIVO */

@media(max-width:768px){

    .banner h1{
        font-size:32px;
    }

    .titulo{
        font-size:28px;
    }

    label{
        font-size:17px;
    }

    .sidebar{
        width:260px;
    }

}


/* === POLIMENTO VISUAL E ANIMAÇÕES EXTRAS === */
html { scroll-behavior: smooth; }
body { isolation: isolate; }
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background: radial-gradient(ellipse at 15% 15%, rgba(250,204,21,.08), transparent 38%),
                radial-gradient(ellipse at 85% 80%, rgba(56,189,248,.06), transparent 35%);
    animation: brilhoAmbiente 9s ease-in-out infinite alternate;
}
@keyframes brilhoAmbiente {
    from { opacity: .45; }
    to { opacity: 1; }
}
.logo { transition: transform .35s ease, filter .35s ease; }
.logo:hover { transform: translateY(-2px) scale(1.04); filter: drop-shadow(0 0 10px rgba(250,204,21,.65)); }
.menu-btn, .fechar { user-select: none; }
.menu-btn:focus-visible, .fechar:focus-visible, a:focus-visible, button:focus-visible {
    outline: 3px solid #facc15; outline-offset: 4px;
}
.sidebar a { position: relative; }
.sidebar a::after {
    content: ""; position: absolute; left: 15px; right: 15px; bottom: 7px;
    height: 2px; background: currentColor; transform: scaleX(0);
    transform-origin: left; transition: transform .3s ease;
}
.sidebar a:hover::after { transform: scaleX(1); }
h1 { animation: tituloBrilho 3.5s ease-in-out infinite alternate; }
@keyframes tituloBrilho {
    from { text-shadow: 0 0 8px rgba(250,204,21,.35); }
    to { text-shadow: 0 0 24px rgba(250,204,21,.75); }
}
.card, .texto, .time, .info {
    will-change: transform;
}
.card:hover, .texto:hover, .time:hover, .info:hover {
    transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
}
button, .botao { position: relative; overflow: hidden; }
button::after, .botao::after {
    content: ""; position: absolute; inset: 0; left: -120%; width: 70%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent);
    transform: skewX(-20deg); transition: left .65s ease;
}
button:hover::after, .botao:hover::after { left: 150%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
}


.revelar-scroll { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.75,.25,1); }
.revelar-scroll.revelado { opacity: 1; transform: translateY(0); }

</style>
</head>

<script>

/* === INTERAÇÕES E ANIMAÇÕES AO ROLAR A PÁGINA === */
(function () {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const abrir = () => {
        if (sidebar) sidebar.classList.add('ativo');
        if (overlay) overlay.classList.add('ativo');
        document.body.classList.add('menu-aberto');
    };
    const fechar = () => {
        if (sidebar) sidebar.classList.remove('ativo');
        if (overlay) overlay.classList.remove('ativo');
        document.body.classList.remove('menu-aberto');
    };
    window.abrirMenu = abrir;
    window.fecharMenu = fechar;
    if (overlay) overlay.addEventListener('click', fechar);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });

    const seletores = 'main h2, .conteudo > h1, .conteudo > .info, .container .card, .cards .card, .timeline .time, .texto';
    const itens = document.querySelectorAll(seletores);
    if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        itens.forEach(el => el.classList.add('revelar-scroll'));
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('revelado');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.12, rootMargin: '0px 0px -35px 0px' });
        itens.forEach(el => observer.observe(el));
    }
})();

</script>
